name: Build Flutter Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build-flutter-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: |
          flutter pub get

      - name: Build Windows release
        working-directory: frontend
        run: flutter build windows --release

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: StuffStorageManager-flutter-windows-exe
          path: |
            frontend/build/windows/x64/runner/Release/*.exe
            frontend/build/windows/x64/runner/Release/*.dll
            frontend/build/windows/x64/runner/Release/data/**
          if-no-files-found: error
